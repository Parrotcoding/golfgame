<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Prevent zooming/scaling and disable scrolling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="styles.css" />
  <title>Golf Game</title>
</head>
<body>
  <!-- Overlay for motion sensor permission -->
  <div id="overlay">
    <h1>Welcome to Golf Game</h1>
    <p>Please tap to start and allow motion sensor access.</p>
    <button id="startButton">Start Game</button>
  </div>

  <h1>Golf Game</h1>
  <div class="controls">
    <label for="clubSelect">Select Club:</label>
    <select id="clubSelect">
      <option value="driver">Driver</option>
      <option value="iron">Iron</option>
      <option value="hybrid">Hybrid</option>
      <option value="putter">Putter</option>
    </select>
    <p id="promptMessage">Tap near the ball to aim your shot.</p>
    <button id="swingButton" disabled>Swing</button>
    <button id="zoomInButton">Zoom In</button>
    <button id="zoomOutButton">Zoom Out</button>
  </div>

  <canvas id="courseCanvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
